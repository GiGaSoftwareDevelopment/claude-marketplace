[project]
name = "scribe-mcp"
version = "0.1.1"
description = "Local MCP server for the scribe plugin: writes Claude session notes to a git-versioned notes repo."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
